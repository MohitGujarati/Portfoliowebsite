name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # API routes need a server; Vercel runs them, a static export cannot.
      - run: rm -rf app/api
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # "" for a MohitGujarati.github.io repo, "/<repo>" for a project repo
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Canonical URLs point at the Vercel site, so search engines treat it as the one official copy.
          NEXT_PUBLIC_SITE_URL: https://mohitgujarati.vercel.app
          NEXT_PUBLIC_GA_ID: G-ZEZ78GD0WE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
